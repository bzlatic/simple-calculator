<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="calc">
        <div id="result"></div>
        <div id="buttons">
            <button id="backspace" class="spec">DEL</button>
            <button id="clear" class="spec">AC</button>
            <button id="perc" class="spec">%</button>
            <button id="division" class="func">/</button>
            <button id="seven" class="num">7</button>
            <button id="eight" class="num">8</button>
            <button id="nine" class="num">9</button>
            <button id="multiplication" class="func">*</button>
            <button id="four" class="num">4</button>
            <button id="five" class="num">5</button>
            <button id="six" class="num">6</button>
            <button id="subtraction" class="func">-</button>
            <button id="one" class="num">1</button>
            <button id="two" class="num">2</button>
            <button id="three" class="num">3</button>
            <button id="addition" class="func">+</button>
            <button id="zero" class="num">0</button>
            <button id="decimal-point" class="num">.</button>
            <button id="brackets" class="num">( )</button>
            <button id="evaluate" class="func">=</button>
        </div>
    </div>
</body>
</html>
