<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="calc">
        <div id="result"></div>
        <div id="buttons">
            <button id="backspace" class="spec"></button>
            <button id="clear" class="spec"></button>
            <button id="perc" class="spec"></button>
            <button id="division" class="func"></button>
            <button id="seven" class="num"></button>
            <button id="eight" class="num"></button>
            <button id="nine" class="num"></button>
            <button id="multiplication" class="func"></button>
            <button id="four" class="num"></button>
            <button id="five" class="num"></button>
            <button id="six" class="num"></button>
            <button id="subtraction" class="func"></button>
            <button id="one" class="num"></button>
            <button id="two" class="num"></button>
            <button id="three" class="num"></button>
            <button id="addition" class="func"></button>
            <button id="zero" class="num"></button>
            <button id="left-bracket" class="num"></button>
            <button id="right-bracket" class="num"></button>
            <button id="evaluate" class="func"></button>
        </div>
    </div>
</body>
</html>
